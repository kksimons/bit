[package]
name = "bit"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local speech-to-text: Parakeet TDT 0.6B v2 via ONNX Runtime (CPU)
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx", "whisper-cpp"] }
cpal = "0.18"
tauri-plugin-autostart = "2"
rmcp = { version = "2", features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["io-util", "net", "sync", "time", "rt", "fs"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = "0.3"
url = "2.5.8"
libc = "0.2.186"

[lints.clippy]
# `cargo clippy -- -D warnings` (see `bun run lint:rust`) escalates these to errors.
all = "warn"

[dev-dependencies]
tempfile = "3"

# Release tuning — follows the Tauri v2 App Size guide:
# https://v2.tauri.app/concept/size/
#   lto + codegen-units=1 let the optimizer cross-crate inline and dead-strip,
#   opt-level="s" targets size, strip drops debug symbols, panic="abort"
#   removes the unwinding tables.
# Trade-off: panic="abort" means any panic exits the whole app rather than
# just the panicking thread, and incremental release compiles are slower.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

